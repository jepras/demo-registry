name: Enforce no-delete registry

# Second safety net (the Worker is the first). Fails if any existing demo entry
# is REMOVED — manually, via PR, or otherwise. Entries may be edited in place
# (the Worker supports this), so modifications are allowed; only deletions are a
# hard, visible failure. Git history is the ultimate backstop.

on:
  pull_request:
    paths: ["registry.json"]
  push:
    branches: [main]
    paths: ["registry.json"]

jobs:
  no-delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # need the previous version to diff against

      - name: Verify no entries were removed
        run: |
          node - <<'EOF'
          const { execSync } = require("child_process");
          const fs = require("fs");

          const curr = JSON.parse(fs.readFileSync("registry.json", "utf8"));

          let prevRaw;
          try {
            prevRaw = execSync("git show HEAD~1:registry.json", { encoding: "utf8" });
          } catch {
            console.log("No previous version of registry.json — nothing to compare.");
            process.exit(0);
          }
          const prev = JSON.parse(prevRaw);

          const currById = new Map((curr.demos || []).map(d => [d.id, d]));
          const problems = [];

          for (const old of prev.demos || []) {
            if (!currById.has(old.id)) {
              problems.push(`Entry removed: ${old.id}`);
            }
          }

          if (problems.length) {
            console.error("No-delete violation:\n" + problems.join("\n"));
            process.exit(1);
          }
          console.log(`OK — ${(curr.demos||[]).length} entries, none removed.`);
          EOF
